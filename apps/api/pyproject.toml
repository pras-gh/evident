[project]
name = "parallx-api"
version = "1.0.0"
requires-python = ">=3.11"
# Everything the API process imports, including the ingest worker behind
# POST /v1/ingest. Run it with tools/dev.sh api, which puts the packages and
# the repository root (for `workers`) on the path.
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3",
  "parallx-db", "parallx-parser", "parallx-graph", "parallx-memory",
  "parallx-ai", "parallx-retrieval",
]

[tool.uv.sources]
parallx-db        = { path = "../../packages/db",        editable = true }
parallx-parser    = { path = "../../packages/parser",    editable = true }
parallx-graph     = { path = "../../packages/graph",     editable = true }
parallx-memory    = { path = "../../packages/memory",    editable = true }
parallx-ai        = { path = "../../packages/ai",        editable = true }
parallx-retrieval = { path = "../../packages/retrieval", editable = true }
