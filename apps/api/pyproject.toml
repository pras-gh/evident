[project]
name = "evident-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3",
  "evident-db", "evident-retrieval",
]

[tool.uv.sources]
evident-db        = { path = "../../packages/db",        editable = true }
evident-retrieval = { path = "../../packages/retrieval", editable = true }
