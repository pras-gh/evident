[project]
name = "evident-parser"
version = "0.1.0"
description = "HTML and PDF filing parsing, chunking, and stable paragraph ids."
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.0,<7",   # font metrics for bounding boxes — verified on 6.x
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evident_parser"]
