[project]
name = "evident-ai"
version = "0.1.0"
description = "Claude prompts and entity extraction."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "anthropic>=0.40",
  "evident-graph",
  "evident-parser",
]

[tool.uv.sources]
evident-graph  = { path = "../graph", editable = true }
evident-parser = { path = "../parser", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evident_ai"]
