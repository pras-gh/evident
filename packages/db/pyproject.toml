[project]
name = "evident-db"
version = "0.1.0"
description = "SQLAlchemy models, sessions and repositories for the memory engine."
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3", "alembic>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evident_db"]
