[alembic]
script_location = alembic
# The model layer imports the canonical taxonomy from packages/graph, so both
# must be importable. Keep this file ASCII: alembic reads it with the locale
# codec, and under LC_ALL=C a stray non-ASCII byte fails before any migration
# runs.
prepend_sys_path = ../packages/db:../packages/graph
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
